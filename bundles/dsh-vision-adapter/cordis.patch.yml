# dsh-vision-adapter bundle 配置层。
#
# 只做纯增量补丁：插入插件行 + 可选放宽附件限制。不碰官方 llm-deepseek 行——
# 隐身接管（无感替换 deepseek-official 路由）需要官方行不在场，请在 profile
# 补丁层（~/.dsh/profiles/<profile>/cordis.patch.yml）自行禁用：
#
#   - id: llm-deepseek
#     name: '@deepseek-ai/dsh-llm-deepseek'
#     disabled: true
#
# 未禁用时插件自动回退：注册「DeepSeek + 自动识图」包装组路由 deepseek-vision，
# 在模型选择器里手动选它即可发图（官方 deepseek-official 路由原样保留）。

- insert:
    - id: dsh-vision-adapter
      name: dsh-vision-adapter
      config:
        enabled: true
        # OpenAI 兼容多模态端点（baseURL 需含 /v1 风格前缀，如
        # https://api.openai.com/v1；也支持 siliconflow / 智谱 / OpenRouter 等）
        baseURL: https://api.openai.com/v1
        # 建议用环境变量注入：!!js process.env.VISION_API_KEY（勿写死明文）
        apiKey: ''
        model: gpt-4o-mini
        autoCaption: false
